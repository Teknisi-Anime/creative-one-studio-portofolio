# https://github.com/firebase/firebase-tools
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREATIVE_ONE_STUDIO }}
          channelId: live
          projectId: creative-one-studio
      - name: Archive to Wayback Machine
        run: |
          curl -X POST "https://web.archive.org/save" \
            -H "Accept: application/json" \
            -H "Authorization: LOW ${{ secrets.ARCHIVE_ACCESS_KEY }}:${{ secrets.ARCHIVE_SECRET_KEY }}" \
            -d "url=https://creatifox.web.app/"
